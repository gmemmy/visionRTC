pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: yarn eslint --max-warnings=0 {staged_files}
    types:
      glob: "*.{js,ts,jsx,tsx}"
      run: yarn tsc -p tsconfig.build.json --noEmit
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
